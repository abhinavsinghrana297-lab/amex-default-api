# CI/CD for the AmEx default prediction API.
# On every push and pull request: run the tests, build the Docker image, and smoke-test the running container.
# On a push to main (after everything passed): publish the image to GitHub Container Registry (ghcr.io).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (golden file + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install libraries
        run: pip install -r requirements-dev.txt

      - name: Download model release
        run: python scripts/download_model.py

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Build, smoke-test and publish image
    needs: test                     # only runs if the tests passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write               # allowed to push to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Start container
        run: docker run -d -p 8000:8000 --name amex-api "$IMAGE:${{ github.sha }}"

      - name: Smoke test (golden customers through the running container)
        run: |
          python scripts/download_model.py
          python scripts/smoke_test.py http://127.0.0.1:8000

      - name: Container logs (shown if something failed)
        if: failure()
        run: docker logs amex-api

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
